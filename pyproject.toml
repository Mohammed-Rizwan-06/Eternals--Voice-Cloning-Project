[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voxshield"
version = "0.1.0"
description = "Truthful near-real-time call protection integration foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["voxshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
